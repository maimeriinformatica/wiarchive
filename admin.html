<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Redazione · WIARCHIVE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  body { font-size: 14px; }
  .adm { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
  .adm aside { background: var(--band); color: #B8C3D3; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .adm aside .logo { color: #fff; font-size: 22px; padding: 4px 8px 18px; }
  .adm aside button { display: flex; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 9px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
  .adm aside button:hover, .adm aside button.on { background: var(--band-2); color: #fff; }
  .adm aside .who { margin-top: 24px; padding: 12px; border-top: 1px solid #1E3048; font-size: 12.5px; }
  .adm .content { padding: 26px 28px 60px; min-width: 0; }
  .adm h1 { font-family: var(--display); font-stretch: 75%; font-weight: 800; text-transform: uppercase; font-size: 34px; margin: 0 0 18px; letter-spacing: .01em; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 12px; min-width: 220px; }
  .tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.code, td.meta { white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--mono); font-size: 12.5px; }
  .tmb { width: 96px; } .tmb .thumb .dur { font-size: 10px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .pill.pub { background: color-mix(in srgb, #2E7D5B 18%, var(--surface)); color: #2E7D5B; }
  .pill.draft { background: var(--surface-2); color: var(--ink-2); }
  .pill.feat { background: color-mix(in srgb, var(--amber) 20%, var(--surface)); color: var(--amber); }
  .link { background: none; border: 0; color: var(--brand); font-weight: 600; cursor: pointer; padding: 2px 4px; }
  .link.danger { color: var(--onair); }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
  .kpi b { display: block; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .form { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; max-width: 980px; }
  .form .full { grid-column: 1 / -1; }
  .form .actions-row { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .drop { border: 2px dashed var(--line); border-radius: 4px; padding: 22px; text-align: center; color: var(--ink-2); cursor: pointer; }
  .drop.over { border-color: var(--brand); background: var(--brand-soft); }
  .progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .progress div { height: 100%; width: 0; background: var(--brand); transition: width .2s; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; margin: 8px 0 14px; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--band); }
  .login form { background: var(--surface); padding: 28px; border-radius: 6px; width: 100%; max-width: 380px; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--ink); color: var(--ground); padding: 12px 16px; border-radius: 4px; font-weight: 600; z-index: 99; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .radar-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; margin-bottom: 18px; align-items: start; }
  .cluster { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; margin-bottom: 12px; }
  .cluster .ch { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .cluster h3 { margin: 4px 0 4px; font-size: 17px; line-height: 1.25; }
  .cluster .conf { font-size: 12.5px; color: var(--ink-2); }
  .cluster .conf b { font-family: var(--display); font-stretch: 75%; font-size: 22px; color: var(--brand); vertical-align: -2px; }
  .cluster .cact { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cluster .members { margin: 12px 0 0; padding-left: 20px; font-size: 13.5px; display: grid; gap: 8px; }
  .cluster .members a { color: var(--brand); }
  .cluster .mm { color: var(--ink-3); font-size: 12px; }
  .cluster .members li { line-height: 1.45; }
  .synth { margin-top: 12px; padding: 12px 14px; background: var(--brand-soft); border-radius: 4px; font-size: 13.5px; }
  .synth p { margin: 4px 0 0; } .synth ul { margin: 4px 0 0; padding-left: 18px; }
  @media (max-width: 900px) { .radar-head { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    .adm { grid-template-columns: 1fr; } .adm aside { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; }
    .adm aside .logo { width: 100%; padding-bottom: 8px; } .adm aside button { width: auto; } .adm aside .who { display: none; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form, .two { grid-template-columns: 1fr; } .adm .content { padding: 20px 16px 50px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="/admin.js"></script>
</body>
</html>
