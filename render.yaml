services:
  - type: web
    name: wiarchive
    runtime: node
    plan: starter            # il disco persistente richiede un piano a pagamento
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/site
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY      # facoltativa: attiva la verifica incrociata con AI nel Radar
        sync: false
      - key: ANTHROPIC_MODEL        # facoltativa: modello da usare (vedi docs.claude.com)
        sync: false
      - key: MAX_UPLOAD_MB
        value: "4096"
    disk:
      name: wiarchive-data
      mountPath: /var/data
      sizeGB: 50
